version: 2
project_name: lookup
builds:
- id: json-simple-path
  main: ./cmd/json-simple-path
  binary: json-simple-path
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  - android
  goarch:
  - amd64
  - arm64
  - '386'
  ignore:
  - goos: android
    goarch: amd64
  - goos: android
    goarch: '386'
- id: yaml-simple-path
  main: ./cmd/yaml-simple-path
  binary: yaml-simple-path
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  - android
  goarch:
  - amd64
  - arm64
  - '386'
  ignore:
  - goos: android
    goarch: amd64
  - goos: android
    goarch: '386'
- id: json-simpe-path
  main: ./cmd/json-simpe-path
  binary: json-simpe-path
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  - android
  goarch:
  - amd64
  - arm64
  - '386'
  ignore:
  - goos: android
    goarch: amd64
  - goos: android
    goarch: '386'
- id: yaml-simpe-path
  main: ./cmd/yaml-simpe-path
  binary: yaml-simpe-path
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  - android
  goarch:
  - amd64
  - arm64
  - '386'
  ignore:
  - goos: android
    goarch: amd64
  - goos: android
    goarch: '386'
archives:
- id: json
  ids:
  - json-simple-path
  - json-simpe-path
  name_template: '{{ .ProjectName }}_{{ .Version }}_json_{{ .Os }}_{{ .Arch }}'
  format_overrides:
  - goos: windows
    formats:
    - zip
  files:
  - man/json*.1
- id: yaml
  ids:
  - yaml-simple-path
  - yaml-simpe-path
  name_template: '{{ .ProjectName }}_{{ .Version }}_yaml_{{ .Os }}_{{ .Arch }}'
  format_overrides:
  - goos: windows
    formats:
    - zip
  files:
  - man/yaml*.1
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ .Tag }}-next'
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
nfpms:
- vendor: Ubels Software Development
  homepage: https://github.com/arran4/lookup
  maintainer: Arran Ubels <arran@ubels.com.au>
  description: Command-line tool to query JSON and YAML files using lookup paths
  license: BSD-3-Clause
  formats:
  - apk
  - deb
  - rpm
  - termux.deb
  - archlinux
  release: 1
  section: default
  priority: extra
  contents:
  - src: man/*.1
    dst: '{{ if eq .Format "termux.deb" }}/data/data/com.termux/files/usr/share/man/man1{{
      else }}/usr/share/man/man1{{ end }}'
release:
  github:
    owner: arran4
    name: lookup
